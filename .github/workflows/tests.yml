name: Python unit tests

on:
  push:
    branches:
      - main
      - optimize-faiss-build
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --upgrade pip numpy
      - name: Compile application and test modules
        run: python -m compileall -q face_search_gui.py facesearch tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
