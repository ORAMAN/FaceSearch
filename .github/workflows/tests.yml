name: Python unit tests

on:
  push:
    branches:
      - main
      - optimize-faiss-build
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --upgrade pip numpy
      - name: Compile application and test modules
        run: python -m compileall -q face_search_gui.py server_http.py facesearch tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check HTTP page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("server_http.py").read_text(encoding="utf-8")
          match = re.search(r'PAGE_TEMPLATE = r"""(.*?)"""', source, re.S)
          if not match:
              raise SystemExit("PAGE_TEMPLATE was not found in server_http.py")
          scripts = re.findall(r"<script>(.*?)</script>", match.group(1), re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in PAGE_TEMPLATE")
          Path("http-page-check.js").write_text(chr(10).join(scripts), encoding="utf-8")
          PY
          node --check http-page-check.js
      - name: Check camera capture flow
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("server_http.py").read_text(encoding="utf-8")
          required = (
              'id="camera-video"',
              'id="camera-capture"',
              "navigator.mediaDevices.getUserMedia",
              "function captureCameraPhoto()",
              "snapshot.toBlob(",
              "useFile(photo);",
              'capture="environment"',
              'id="image-url"',
              'id="load-url-button"',
              'id="file-button"',
              'id="file-input" type="file" accept="image/*" hidden',
              '_fetch_remote_image_data_url',
              '"/api/load-image"',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Image source UI/processing flow missing: " + ", ".join(missing))
          if source.index('id="file-input"') > source.index('id="drop-copy"'):
              raise SystemExit("File chooser must be outside the hideable dropzone instructions.")
          print("Camera, persistent local file chooser, and HTTP image URL flows are present.")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
